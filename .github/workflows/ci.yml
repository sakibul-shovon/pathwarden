name: ci

# Required status checks for `main` (configure after the first successful run): `repo-hygiene` and `api`.
# Add `web` when P10a enables that job.
#
# BOOTSTRAP NOTE: steps in `api` are guarded with hashFiles('pyproject.toml') so the very first push
# (workflow files + plan.md, before P0 exists) stays green. P0-T9 removes the guards, which makes a
# missing scaffold a hard failure again.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret-shape scan
        run: sh scripts/scan_secrets.sh

  api:
    runs-on: ubuntu-latest
    services:
      falkordb:
        # P0-T10: pin to the exact tag/digest verified by `make probe` (D-012) instead of `latest`.
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ hashFiles('pyproject.toml') != '' }}
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: python -m pip install -e ".[dev]"

      - name: Wait for FalkorDB
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; then echo "falkordb reachable"; exit 0; fi
            sleep 1
          done
          echo "falkordb not reachable" >&2; exit 1

      - name: Lint
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: make lint

      - name: Tests (no LLM key, no network beyond localhost)
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: make test

  # P10a-T1: uncomment when web/ exists, then add `web` to the required checks.
