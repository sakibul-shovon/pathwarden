name: ci

# Required status checks for `main` (configure after the first successful run): `repo-hygiene` and `api`.
# `web` (strict TypeScript build) joined in P10a: add it to the required checks too.
#
# Scaffold exists (P0): a missing pyproject.toml / Makefile is a hard failure.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret-shape scan
        run: sh scripts/scan_secrets.sh

  api:
    runs-on: ubuntu-latest
    services:
      falkordb:
        # Pinned by digest to the image `make probe` passed on (D-012); keep in sync with docker-compose.yml.
        image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev,mcp]"

      - name: Wait for FalkorDB
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; then echo "falkordb reachable"; exit 0; fi
            sleep 1
          done
          echo "falkordb not reachable" >&2; exit 1

      - name: Lint
        run: make lint

      - name: Tests (no LLM key, no network beyond localhost)
        run: make test

      - name: Tests in hosted mode (PW_AUTH=on, workspace keys required)
        run: make test-auth

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # `tsc --noEmit` (strict) then `vite build`: type errors fail the job
